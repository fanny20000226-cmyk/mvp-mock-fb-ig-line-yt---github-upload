name: Production read-only health check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Public login is reachable
        run: curl --fail --show-error --silent https://car-shop-manage.vercel.app/login > /dev/null
      - name: Admin API rejects anonymous access
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" https://car-shop-manage.vercel.app/api/admin/enterprise)
          test "$status" = "401" -o "$status" = "403"
      - name: N8N callback rejects unsigned access
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST --header "content-type: application/json" --data '{"status":"health-check"}' https://car-shop-manage.vercel.app/api/n8n/callback)
          test "$status" = "401" -o "$status" = "403"
