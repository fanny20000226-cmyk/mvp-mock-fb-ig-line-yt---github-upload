name: Trigger Vercel Deploy Hook

on:
  push:
    branches: ["main"]
    paths:
      - "next-carcare/**"
      - ".github/workflows/vercel-deploy-hook.yml"
  workflow_dispatch:

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: "https://api.vercel.com/v1/integrations/deploy/prj_tHNszWFz5YdizDpO2Nz7Fh2CNmus/ar0Z9gOIDb"
        run: |
          curl --fail --show-error --silent --request POST --location "$VERCEL_DEPLOY_HOOK_URL"
