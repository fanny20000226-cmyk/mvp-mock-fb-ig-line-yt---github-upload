name: Trigger Vercel Deploy Hook

on:
  push:
    branches: ["main"]
    paths:
      - "next-carcare/**"
      - ".github/workflows/vercel-deploy-hook.yml"
  workflow_dispatch:

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing repository secret VERCEL_DEPLOY_HOOK_URL."
            exit 1
          fi

          curl --fail --show-error --silent --location "$VERCEL_DEPLOY_HOOK_URL"
