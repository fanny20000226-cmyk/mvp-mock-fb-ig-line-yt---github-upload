name: Deploy car-shop-manage to Vercel

on:
  push:
    branches: ["main"]
    paths:
      - "next-carcare/**"
      - ".github/workflows/vercel-deploy-hook.yml"
  workflow_dispatch:

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_60CTxFTEm5VKABqOP3AWDFms
      VERCEL_PROJECT_ID: prj_tHNszWFz5YdizDpO2Nz7Fh2CNmus
      VERCEL_TEAM_SLUG: fanny20000226-1026s-projects
      VERCEL_DEPLOY_HOOK_URL: "https://api.vercel.com/v1/integrations/deploy/prj_tHNszWFz5YdizDpO2Nz7Fh2CNmus/5FxMhJaBhy"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Next app with Vercel CLI when token exists
        if: env.VERCEL_TOKEN != ''
        working-directory: next-carcare
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"orgId":"$VERCEL_ORG_ID","projectId":"$VERCEL_PROJECT_ID"}
          EOF
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          vercel build --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG"

      - name: Fallback trigger deploy hook when token is missing
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "VERCEL_TOKEN secret is missing; falling back to Deploy Hook."
          curl --fail --show-error --silent --request POST "$VERCEL_DEPLOY_HOOK_URL"
